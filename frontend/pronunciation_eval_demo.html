<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>全龄段智能体 · 发音评测演示</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; }
  .row { margin: 12px 0; }
  label { display: inline-block; width: 80px; }
  select, input[type=text] { padding: 6px 8px; font-size: 15px; }
  button { padding: 8px 16px; font-size: 15px; border: 0; border-radius: 8px; background: #1aa3a3; color: #fff; cursor: pointer; margin-right: 8px; }
  button:disabled { background: #9ad; cursor: not-allowed; }
  #recBtn.recording { background: #e0533d; }
  pre { background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 8px; padding: 12px; overflow: auto; }
  .coach { background: #eafaf7; border: 1px solid #b8e6dd; border-radius: 8px; padding: 12px; white-space: pre-wrap; }
  .tip { color: #666; font-size: 13px; }
</style>
</head>
<body>
  <h1>全龄段多语言学习智能体 · 发音评测演示</h1>
  <p class="tip">本页直接调用腾讯云函数（讯飞评测），绕开 Coze 工作流外网限制；评测结果再转发给 Coze Bot 生成指导。</p>

  <div class="row">
    <label>板块</label>
    <select id="board">
      <option value="english">英语</option>
      <option value="pinyin">拼音</option>
      <option value="multilingual">多语种</option>
    </select>
  </div>

  <div class="row">
    <label>参考句</label>
    <input id="refText" type="text" value="hello" size="30" />
  </div>

  <div class="row">
    <button id="recBtn">🎤 开始跟读录音</button>
    <button id="submitBtn" disabled>提交评测</button>
  </div>

  <div class="row">
    <strong>评测原始结果：</strong>
    <pre id="raw">（录音后点“提交评测”）</pre>
  </div>

  <div class="row">
    <strong>Coze 生成的发音指导：</strong>
    <div id="coach" class="coach">（待生成）</div>
  </div>

  <div class="row">
    <button id="speakBtn" disabled>🔊 朗读指导</button>
  </div>

<script>
// ===== 配置（按需修改）=====
const SCF_URL = "https://1417297297-kj0qvxz13p.ap-guangzhou.tencentscf.com";
const COZE_TOKEN = "YOUR_COZE_PAT";      // 在 coze.cn 个人设置里生成 Personal Access Token
const COZE_BOT_ID = "YOUR_BOT_ID";       // 你的智能体 Bot ID

// ===== 录音状态 =====
let audioCtx = null, sourceNode = null, processor = null, stream = null;
let recordedBuffers = [];
let sampleRate = 44100;

const recBtn = document.getElementById("recBtn");
const submitBtn = document.getElementById("submitBtn");
const speakBtn = document.getElementById("speakBtn");

recBtn.onclick = async () => {
  if (recBtn.classList.contains("recording")) {
    stopRec();
  } else {
    await startRec();
  }
};

async function startRec() {
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  sampleRate = audioCtx.sampleRate;
  sourceNode = audioCtx.createMediaStreamSource(stream);
  processor = audioCtx.createScriptProcessor(4096, 1, 1);
  recordedBuffers = [];
  processor.onaudioprocess = (e) => {
    recordedBuffers.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  };
  sourceNode.connect(processor);
  processor.connect(audioCtx.destination);
  recBtn.textContent = "⏹ 停止并保存";
  recBtn.classList.add("recording");
  submitBtn.disabled = true;
}

function stopRec() {
  processor.disconnect();
  sourceNode.disconnect();
  stream.getTracks().forEach((t) => t.stop());
  recBtn.textContent = "🎤 重新录音";
  recBtn.classList.remove("recording");
  submitBtn.disabled = false;
}

// ===== 重采样到 16k + 封装 WAV =====
function resampleTo16k(buffers, fromRate) {
  let total = 0;
  for (const b of buffers) total += b.length;
  const merged = new Float32Array(total);
  let off = 0;
  for (const b of buffers) { merged.set(b, off); off += b.length; }
  const toRate = 16000;
  const ratio = fromRate / toRate;
  const newLen = Math.round(total / ratio);
  const out = new Float32Array(newLen);
  for (let i = 0; i < newLen; i++) {
    const idx = i * ratio;
    const i0 = Math.floor(idx);
    const i1 = Math.min(i0 + 1, total - 1);
    const f = idx - i0;
    out[i] = merged[i0] * (1 - f) + merged[i1] * f;
  }
  return out;
}

function floatTo16BitPCM(input) {
  const out = new Int16Array(input.length);
  for (let i = 0; i < input.length; i++) {
    const s = Math.max(-1, Math.min(1, input[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out;
}

function encodeWAV(samples16) {
  const buffer = new ArrayBuffer(44 + samples16.length * 2);
  const view = new DataView(buffer);
  const ws = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
  ws(0, "RIFF"); view.setUint32(4, buffer.byteLength - 8, true); ws(8, "WAVE");
  ws(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, 1, true); view.setUint32(24, 16000, true); view.setUint32(28, 32000, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  ws(36, "data"); view.setUint32(40, samples16.length * 2, true);
  let off = 44;
  for (let i = 0; i < samples16.length; i++) { view.setInt16(off, samples16[i], true); off += 2; }
  return new Uint8Array(buffer);
}

// ===== 提交评测 =====
submitBtn.onclick = async () => {
  if (!recordedBuffers.length) { alert("请先录音"); return; }
  const reference_text = document.getElementById("refText").value.trim();
  const board = document.getElementById("board").value;
  const pcm16 = floatTo16BitPCM(resampleTo16k(recordedBuffers, sampleRate));
  const wav = encodeWAV(pcm16);
  const audio_base64 = btoa(String.fromCharCode.apply(null, wav));

  document.getElementById("raw").textContent = "评测中...";
  try {
    const resp = await fetch(SCF_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ audio_base64, reference_text, board }),
    });
    const data = await resp.json();
    document.getElementById("raw").textContent = JSON.stringify(data, null, 2);

    if (data.error) {
      document.getElementById("coach").textContent = "云函数返回错误：" + data.error;
      return;
    }
    await callCoze(data, reference_text, board);
  } catch (e) {
    document.getElementById("raw").textContent = "请求失败：" + e.message;
  }
};

// ===== 转发给 Coze Bot 生成指导 =====
async function callCoze(evalResult, reference_text, board) {
  const userMsg =
    `【发音评测结果】参考句：${reference_text}；板块：${board}；` +
    `评测JSON：${JSON.stringify(evalResult)}。请根据评测结果给出发音诊断、标准示范和跟读练习。`;
  document.getElementById("coach").textContent = "Coze 生成中...";
  try {
    const resp = await fetch("https://api.coze.cn/v3/chat", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${COZE_TOKEN}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        bot_id: COZE_BOT_ID,
        user_id: "demo_user",
        stream: false,
        auto_save_history: true,
        additional_messages: [{ role: "user", content: userMsg, content_type: "text" }],
      }),
    });
    const data = await resp.json();
    let reply = "";
    if (data && data.data && Array.isArray(data.data.messages)) {
      for (const m of data.data.messages) {
        if (m.role === "assistant") reply += m.content;
      }
    } else if (data && data.msg) {
      reply = "Coze 返回：" + data.msg;
    }
    document.getElementById("coach").textContent = reply || JSON.stringify(data, null, 2);
    speakBtn.disabled = false;
  } catch (e) {
    document.getElementById("coach").textContent = "Coze 调用失败：" + e.message;
  }
}

speakBtn.onclick = () => {
  const text = document.getElementById("coach").textContent;
  if (text) speechSynthesis.speak(new SpeechSynthesisUtterance(text));
};
</script>
</body>
</html>
